# Fly.io config for bot + dashboard
# Deploy: fly launch (first time), then fly deploy
# Free tier: 3 shared-cpu VMs, 160GB-mo bandwidth, no sleep

app = "discord-support-bot"
primary_region = "iad"  # US East - closest to Discord gateway

[build]
  # Use the Dockerfile in this repo
  dockerfile = "Dockerfile"

[env]
  # Runtime vars (set secrets with `fly secrets set KEY=value`)
  # DISCORD_TOKEN = ""
  # DASHBOARD_CLIENT_ID = ""
  # DASHBOARD_CLIENT_SECRET = ""
  # DASHBOARD_REDIRECT_URI = "https://discord-support-bot.fly.dev/callback"
  # DASHBOARD_SECRET_KEY = "generate-with-openssl-rand-base64-32"
  # GUILD_ID = ""  # optional
  PYTHONUNBUFFERED = "1"

[processes]
  bot = "python bot.py"
  dashboard = "python dashboard.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # keep dashboard alive on free tier
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  path = "/health"

# Optional: scale dashboard to 0 when not needed (saves free allowance)
# [services]
#   [services.dashboard]
#     protocol = "tcp"
#     internal_port = 8080
#     auto_stop = true